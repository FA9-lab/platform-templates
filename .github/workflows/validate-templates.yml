name: Validate Platform Templates

on:
  pull_request:
    branches:
      - main
    paths:
      - 'node-service/**'
      - '.github/workflows/validate-templates.yaml'

jobs:
  validate-node-service:
    name: Validate Node Service Template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          ruby -e "
          require 'yaml'

          files = [
            'node-service/template.yaml',
            'node-service/skeleton/.github/workflows/ci.yaml',
            'node-service/skeleton/.github/workflows/pr-infrastructure-ci.yaml',
            'node-service/skeleton/.github/workflows/pr-infrastructure-plan.yaml'
          ]

          files.each do |file|
            YAML.load_file(file)
            puts \"Valid YAML: #{file}\"
          end
          "
          
      - name: Validate Backstage template structure
        run: |
          ruby <<'RUBY'
          require 'yaml'

          template = YAML.load_file('node-service/template.yaml')

          abort 'Invalid Backstage API version' unless
            template['apiVersion'] == 'scaffolder.backstage.io/v1beta3'

          abort 'Invalid Backstage kind' unless
            template['kind'] == 'Template'

          metadata = template['metadata']
          abort 'Missing template metadata' unless metadata.is_a?(Hash)

          %w[name title description].each do |field|
            abort "Missing metadata.#{field}" if metadata[field].to_s.empty?
          end

          spec = template['spec']
          abort 'Missing template spec' unless spec.is_a?(Hash)

          %w[owner type].each do |field|
            abort "Missing spec.#{field}" if spec[field].to_s.empty?
          end

          steps = spec['steps']
          abort 'Missing scaffolder steps' unless steps.is_a?(Array) && !steps.empty?

          ids = []

          steps.each do |step|
            abort 'Invalid scaffolder step' unless step.is_a?(Hash)

            %w[id name action].each do |field|
              abort "Step missing #{field}" if step[field].to_s.empty?
            end

            ids << step['id']

            if step['action'] == 'fetch:template'
              source = step.dig('input', 'url')
              abort 'Missing fetch:template source' if source.to_s.empty?

              if source.start_with?('./')
                path = File.expand_path(source, 'node-service')
                abort "Missing skeleton directory: #{path}" unless Dir.exist?(path)
              end
            end
          end

          abort 'Duplicate scaffolder step IDs' unless ids.uniq.length == ids.length

          puts 'Backstage template structure validated successfully'
          RUBY
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        working-directory: node-service/skeleton/infrastructure
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: node-service/skeleton/infrastructure
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: node-service/skeleton/infrastructure
        run: terraform validate
